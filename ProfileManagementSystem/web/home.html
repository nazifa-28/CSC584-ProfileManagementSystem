<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */
        .navbar {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .navbar-brand {
            color: white;
            font-size: 1.3em;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .navbar-nav { display: flex; gap: 10px; }
        .nav-link {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 0.9em;
            font-weight: 500;
            transition: all 0.3s;
        }
        .nav-link:hover { background: white; color: #6c5ce7; }

        /* HERO SECTION */
        .hero {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        .hero-content {
            text-align: center;
            color: white;
            max-width: 700px;
        }

        .hero-icon {
            width: 110px;
            height: 110px;
            background: rgba(255,255,255,0.2);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.3);
            animation: float 3s ease-in-out infinite;
        }
        .hero-icon i { font-size: 3em; color: white; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .hero-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 6px 20px;
            border-radius: 25px;
            font-size: 0.82em;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.3);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .hero-title {
            font-size: 3em;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 20px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }

        .hero-title span {
            background: linear-gradient(90deg, #ffeaa7, #fab1a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-desc {
            font-size: 1em;
            opacity: 0.88;
            line-height: 1.7;
            margin-bottom: 40px;
            font-weight: 300;
        }

        /* BUTTONS */
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 16px 36px;
            border-radius: 14px;
            font-family: 'Poppins', sans-serif;
            font-size: 1em;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: white;
            color: #6c5ce7;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .btn-outline {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 2px solid rgba(255,255,255,0.5);
            backdrop-filter: blur(10px);
        }
        .btn-outline:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-3px);
        }

        /* FEATURES SECTION */
        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 0 20px 60px;
            flex-wrap: wrap;
        }

        .feature-card {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 25px 20px;
            text-align: center;
            color: white;
            width: 160px;
            transition: all 0.3s;
        }
        .feature-card:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-5px);
        }
        .feature-card i {
            font-size: 1.8em;
            margin-bottom: 10px;
            display: block;
        }
        .feature-card h4 { font-size: 0.85em; font-weight: 600; }
        .feature-card p { font-size: 0.75em; opacity: 0.8; margin-top: 4px; }

        /* FOOTER */
        .footer {
            text-align: center;
            padding: 20px;
            color: rgba(255,255,255,0.6);
            font-size: 0.8em;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="home.html" class="navbar-brand">
            <i class="fas fa-id-card"></i> Profile Management System
        </a>
        <div class="navbar-nav">
            <a href="index.html" class="nav-link"><i class="fas fa-plus"></i> Add Profile</a>
            <a href="ProfileServlet?action=view" class="nav-link"><i class="fas fa-users"></i> View All</a>
        </div>
    </nav>

    <!-- HERO -->
    <div class="hero">
        <div class="hero-content">

            <div class="hero-icon">
                <i class="fas fa-id-card"></i>
            </div>

            <h1 class="hero-title">
                Welcome to <span>Profile</span><br>Management System
            </h1>

            <p class="hero-desc">
                A simple and elegant system to manage student profiles.<br>
                Add, view, search, edit and delete profiles with ease.
            </p>

            <div class="btn-group">
                <a href="index.html" class="btn btn-primary">
                    <i class="fas fa-user-plus"></i> Add New Profile
                </a>
                <a href="ProfileServlet?action=view" class="btn btn-outline">
                    <i class="fas fa-users"></i> View All Profiles
                </a>
            </div>

        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        © 2025 Nur Nazifa Humairah Binti Yusaidi | 2025428096 | CSC584
    </div>

</body>
</html>
